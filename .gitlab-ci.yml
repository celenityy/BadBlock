include:
  - component: $CI_SERVER_FQDN/components/slsa/provenance-signer@0.1.1
    inputs:
      bundle_file: provenance.json
      job_name: push-lists-generate-provenance-log-get-sources
      stage: provenance
      target_artifact: $CI_PROJECT_DIR/build/logs/get_sources.log
  - component: $CI_SERVER_FQDN/components/slsa/provenance-signer@0.1.1
    inputs:
      bundle_file: provenance.json
      job_name: push-lists-generate-provenance-log-push-lists
      stage: provenance
      target_artifact: $CI_PROJECT_DIR/build/logs/push-lists.log

default:
  cache: []
  retry:
    max: 2
    when:
      - data_integrity_failure
      - job_execution_timeout
      - runner_configuration_error
      - runner_external_dependency_failure
      - runner_interrupted
      - runner_system_failure
      - scheduler_failure
      - stale_schedule
      - stuck_or_timeout_failure
      - unknown_failure

variables: &common_variables
  ARTIFACT_COMPRESSION_LEVEL: "slowest"
  CACHE_COMPRESSION_LEVEL: "slowest"
  FF_USE_FASTZIP: "1"
  RUNNER_GENERATE_ARTIFACTS_METADATA: true
  TRANSFER_METER_FREQUENCY: "2s"

stages:
  - update_lists
  - provenance

push-lists:
  image: fedora:43
  stage: update_lists
  rules:
    - if: $CI_PROJECT_NAMESPACE != "celenityy"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "pages"
      changes:
      - .gitlab-ci.yml
      - abp/**/*
      - base/**/*
      - hardened/**/*
      - wildcards-no-star/**/*
      - wildcards-star/**/*
      - scripts/build.sh
      - scripts/build-bb.sh
      - scripts/env_common.sh
      - scripts/env_external.sh
      - scripts/env_helpers.sh
      - scripts/get_sources.sh
      - scripts/get_sources-bb.sh
      - scripts/prep.sh
      - scripts/push-lists.sh
      - scripts/push-lists-bb.sh
      - scripts/utilities.sh
      - scripts/versions.sh
  tags:
    - saas-linux-2xlarge-amd64
  variables:
    <<: *common_variables
  before_script:
    - sudo dnf update -y --refresh
  script:
    - set -euo pipefail
    - echo 'Preparing secrets...'
    - bash scripts/prep.sh
    - echo 'Downloading dependencies...'
    - bash -x scripts/get_sources.sh
    - echo 'Pushing lists to S3...'
    - bash -x scripts/push-lists.sh
  artifacts:
    untracked: false
    when: always
    access: all
    expire_in: "30 days"
    paths:
      - $CI_PROJECT_DIR/build/logs/get_sources.log
      - $CI_PROJECT_DIR/build/logs/push-lists.log

push-lists-generate-provenance-log-get-sources:
  stage: provenance
  rules:
    - if: $CI_PROJECT_NAMESPACE != "celenityy"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "pages"
      changes:
      - .gitlab-ci.yml
      - abp/**/*
      - base/**/*
      - hardened/**/*
      - wildcards-no-star/**/*
      - wildcards-star/**/*
      - scripts/build.sh
      - scripts/build-bb.sh
      - scripts/env_common.sh
      - scripts/env_external.sh
      - scripts/env_helpers.sh
      - scripts/get_sources.sh
      - scripts/get_sources-bb.sh
      - scripts/prep.sh
      - scripts/push-lists.sh
      - scripts/push-lists-bb.sh
      - scripts/utilities.sh
      - scripts/versions.sh
  needs:
    - job: push-lists
      optional: false

push-lists-generate-provenance-log-push-lists:
  stage: provenance
  rules:
    - if: $CI_PROJECT_NAMESPACE != "celenityy"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "pages"
      changes:
      - .gitlab-ci.yml
      - abp/**/*
      - base/**/*
      - hardened/**/*
      - wildcards-no-star/**/*
      - wildcards-star/**/*
      - scripts/build.sh
      - scripts/build-bb.sh
      - scripts/env_common.sh
      - scripts/env_external.sh
      - scripts/env_helpers.sh
      - scripts/get_sources.sh
      - scripts/get_sources-bb.sh
      - scripts/prep.sh
      - scripts/push-lists.sh
      - scripts/push-lists-bb.sh
      - scripts/utilities.sh
      - scripts/versions.sh
  needs:
    - job: push-lists
      optional: false
